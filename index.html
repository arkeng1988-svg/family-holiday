    S._entered = -1; S.idx = Math.max(0, Math.min(list.length - 1, S.idx + delta)); S.maxSeen = Math.max(S.maxSeen, S.idx); S.updatedAt = now(); queueSave(); render(); window.scrollTo(0, 0);
    const h = $("#q"); if (h) h.focus({ preventScroll: true });
  }
  // ----- rendering -----
  function render() {
    const main = $("#main"); main.replaceChildren();
    const list = screens(), sc = list[S.idx];
    if (S._entered !== S.idx) { enter(sc.id); S._entered = S.idx; }
    const coreTotal = list.filter(x => x.kind === "item").length;
    const done = list.slice(0, S.idx).filter(x => x.kind === "item").length;
    $("#progress").style.setProperty("--p", Math.round(100 * done / coreTotal) + "%");
    $("#count").textContent = sc.kind === "item" ? `Question ${done + 1} of ${coreTotal}` : "";
    if (sc.kind === "welcome") return renderWelcome(main);
    if (sc.kind === "text") return renderText(main, sc);
    if (sc.kind === "send") return renderSend(main, list);
    renderItem(main, itemDef(sc.id));
  }
  function nav(main, canNext, nextLabel) {
    const bar = el("div", { class: "nav" },
      S.idx > 0 ? el("button", { class: "ghost", type: "button", onclick: () => go(-1) }, "Back") : el("span"),
      el("button", { class: "primary", type: "button", id: "next", disabled: !canNext, onclick: () => go(1) }, nextLabel || "Next"));
    main.append(bar);
  }
  function renderWelcome(main) {
    main.append(el("h1", { id: "q", tabindex: "-1" }, "Planning our family holiday"));
    Q.TEXTS.welcome.forEach(t => main.append(el("p", { class: "lede" }, t)));
    nav(main, true, "Start");
  }
  function renderInfo(main, text) { main.append(el("p", { class: "info", id: "q", tabindex: "-1" }, text)); nav(main, true, "Continue"); }
  function renderText(main, sc) {
    const a = S.answers[sc.id] || {};
    main.append(el("h2", { class: "q", id: "q", tabindex: "-1" }, sc.q));
    const ta = el("textarea", { id: "t-" + sc.id, rows: "5", "aria-labelledby": "q" }); ta.value = a.text || "";
    ta.addEventListener("change", () => setAnswer(sc.id, { text: ta.value.trim(), skipped: !ta.value.trim() }));
    main.append(ta);
    nav(main, true, a.text ? "Next" : "Skip or continue");
  }
  function optButton(label, selected, onclick, cls) {
    return el("button", { type: "button", class: "opt" + (selected ? " on" : "") + (cls ? " " + cls : ""), "aria-pressed": selected ? "true" : "false", onclick }, label);
  }
  function renderItem(main, it) {
    const a = S.answers[it.id];
    const prompt = it.prompt || (it.kind === "ipip" ? Q.TEXTS.ipipPrompt : it.kind === "likert" ? Q.TEXTS.likertPrompt : it.kind === "bw" ? Q.BW_PROMPT : null);
    if (it.title) main.append(el("p", { class: "prompt" }, el("strong", null, it.title)));
    if (prompt && it.kind !== "bw") main.append(el("p", { class: "prompt" }, prompt));
    if (it.kind === "bw") { main.append(el("h2", { class: "q", id: "q", tabindex: "-1" }, Q.BW_PROMPT)); return renderBW(main, it, a); }
    main.append(el("h2", { class: "q" + (it.kind === "ipip" ? " stem" : ""), id: "q", tabindex: "-1" }, it.kind === "ipip" ? "“" + it.q + "”" : it.q));
    if (it.kind === "multi") return renderMulti(main, it, a);
    if (it.kind === "d040") return renderD040(main, it, a);
    const group = el("div", { class: "opts", role: "group", "aria-labelledby": "q" });
    const pick = v => { if (a && a.value === v) return; setAnswer(it.id, { value: v }); render(); };
    let labels;
    if (it.kind === "ipip" || it.kind === "likert" || it.kind === "bipolar") labels = it.scale.map((l, k) => ({ l, v: k + 1 }));
    else if (it.choices) labels = it.choices;
    else { const order = S.plan.optionOrder[it.id] || it.opts.map((_, k) => k); labels = order.map(k => ({ l: it.opts[k], v: "ABCDEFGHIJ"[k] })); }
    labels.forEach(o => group.append(optButton(o.l, a && a.value === o.v, () => pick(o.v))));
    main.append(group);
    const extras = (it.extra || []).concat([Q.PNS]);
    const ex = el("div", { class: "opts extras", role: "group", "aria-label": "Other answers" });
    extras.forEach(x => ex.append(optButton(x, a && a.value === x, () => pick(x), "minor")));
    main.append(ex);
    if (a && a.value === "It depends") {
      const ta = el("textarea", { id: "dep-" + it.id, rows: "3", placeholder: "Depends on what? (optional)", "aria-label": "Depends on what? (optional)" }); ta.value = a.note || "";
      ta.addEventListener("change", () => setAnswer(it.id, { value: "It depends", note: ta.value.trim() }));
      main.append(ta);
    }
    nav(main, !!(a && a.value != null));
  }
  function renderMulti(main, it, a) {
    a = a || { picks: [], texts: {} };
    let opts = it.opts;
    if (it.id === "BW-check") opts = S.plan.optionOrder["BW-check"].map(k => Q.BW_OBJ[k]).concat(["None of these"]);
    const box = el("div", { class: "opts" , role: "group", "aria-labelledby": "q"});
    const toggle = o => {
      let picks = (a.picks || []).filter(x => x !== Q.PNS);
      const excl = (it.exclusive || []);
      if (picks.includes(o)) picks = picks.filter(x => x !== o);
      else if (excl.includes(o)) picks = [o];
      else picks = picks.filter(x => !excl.includes(x)).concat([o]);
      setAnswer(it.id, { picks, texts: a.texts || {} }); render();
    };
    opts.forEach(o => {
      const on = (a.picks || []).includes(o);
      box.append(optButton(o, on, () => toggle(o), "check"));
      if (on && it.textFor && it.textFor.includes(o)) {
        const inp = el("input", { type: "text", id: "tx-" + it.id + "-" + opts.indexOf(o), "aria-label": o, placeholder: "Please say" }); inp.value = (a.texts || {})[o] || "";
        inp.addEventListener("change", () => { const t = Object.assign({}, a.texts || {}); t[o] = inp.value.trim(); setAnswer(it.id, { picks: a.picks, texts: t }); });
        box.append(inp);
      }
    });
    main.append(box);
    const pns = (a.picks || []).includes(Q.PNS);
    main.append(el("div", { class: "opts extras" }, optButton(Q.PNS, pns, () => { setAnswer(it.id, { picks: pns ? [] : [Q.PNS], texts: {} }); render(); }, "minor")));
    nav(main, (a.picks || []).length > 0);
  }
  function renderBW(main, it, a) {
    a = a || {};
    const posOrder = S.plan.bwPos[S.plan.bw.indexOf(it.setIndex)];
    const objs = posOrder.map(k => it.set[k]);
    const set = (field, obj) => { const n = Object.assign({}, a); delete n.pns; n[field] = obj; if (field === "most" && n.least === obj) delete n.least; if (field === "least" && n.most === obj) delete n.most; setAnswer(it.id, n); render(); };
    const grid = el("div", { class: "bw" });
    objs.forEach(o => {
      grid.append(el("div", { class: "bwrow" + (a.most === o ? " most" : a.least === o ? " least" : "") },
        el("span", { class: "bwlabel" }, Q.BW_OBJ[o]),
        el("div", { class: "bwbtns" },
          optButton("Most", a.most === o, () => set("most", o), "pill"),
          optButton("Least", a.least === o, () => set("least", o), "pill"))));
    });
    main.append(grid);
    main.append(el("div", { class: "opts extras" }, optButton(Q.PNS, !!a.pns, () => { setAnswer(it.id, a.pns ? {} : { pns: true }); render(); }, "minor")));
    nav(main, !!(a.pns || (a.most && a.least && a.most !== a.least)));
  }
  function renderD040(main, it, a) {
    a = a || {};
    const others = Q.FAMILY.filter(n => n !== S.respondent).concat(["Someone else"]);
    const box = el("div", { class: "opts", role: "group", "aria-labelledby": "q" });
    [["No one", "none"], ["Yes", "yes"]].forEach(([l, v]) => box.append(optButton(l, a.value === v, () => { setAnswer(it.id, v === "yes" ? { value: "yes", pairs: a.pairs && a.pairs.length ? a.pairs : [{ person: "", other: "", activity: "", any: false }] } : { value: v }); render(); })));
    main.append(box);
    if (a.value === "yes") {
      const pairs = a.pairs.map(p => Object.assign({}, p));
      const commit = () => setAnswer(it.id, { value: "yes", pairs });
      const okNow = () => pairs.every(p => p.person && (p.person !== "Someone else" || p.other) && (p.any || p.activity));
      const live = () => { S.answers[it.id] = { value: "yes", pairs }; const n = $("#next"); if (n) n.disabled = !okNow(); };
      pairs.forEach((p, k) => {
        const sel = el("select", { id: "d040p" + k, "aria-label": "Person" }, el("option", { value: "" }, "Choose a person"), others.map(n => el("option", { value: n, selected: p.person === n }, n)));
        sel.addEventListener("change", () => { p.person = sel.value; commit(); render(); });
        const row = el("div", { class: "pair" }, sel);
        if (p.person === "Someone else") { const o = el("input", { type: "text", id: "d040o" + k, placeholder: "Their name", "aria-label": "Their name" }); o.value = p.other || ""; o.addEventListener("input", () => { p.other = o.value.trim(); live(); }); o.addEventListener("change", () => { p.other = o.value.trim(); commit(); }); row.append(o); }
        const act = el("input", { type: "text", id: "d040a" + k, placeholder: "Which activity?", "aria-label": "Which activity?", disabled: p.any }); act.value = p.activity || "";
        act.addEventListener("input", () => { p.activity = act.value.trim(); live(); }); act.addEventListener("change", () => { p.activity = act.value.trim(); commit(); });
        const any = el("label", { class: "inline" }, el("input", { type: "checkbox", id: "d040any" + k, checked: p.any, onchange: e => { p.any = e.target.checked; commit(); render(); } }), " Any activity");
        row.append(act, any);
        if (pairs.length > 1) row.append(el("button", { type: "button", class: "ghost small", onclick: () => { pairs.splice(k, 1); commit(); render(); } }, "Remove"));
        main.append(row);
      });
      main.append(el("button", { type: "button", class: "ghost small", onclick: () => { pairs.push({ person: "", other: "", activity: "", any: false }); commit(); render(); } }, "Add another person"));
    }
    main.append(el("div", { class: "opts extras" }, optButton(Q.PNS, a.value === Q.PNS, () => { setAnswer(it.id, { value: Q.PNS }); render(); }, "minor")));
    const okPairs = a.value === "yes" && a.pairs.every(p => p.person && (p.person !== "Someone else" || p.other) && (p.any || p.activity));
    nav(main, a.value === "none" || a.value === Q.PNS || okPairs);
  }
  function renderSend(main, list) {
    const items = list.filter(x => x.kind === "item");
    const answered = items.filter(x => S.answers[x.id]).length;
    const pns = items.filter(x => { const v = S.answers[x.id]; return v && (v.value === Q.PNS || v.pns || (v.picks && v.picks[0] === Q.PNS)); }).length;
    main.append(el("h2", { class: "q", id: "q", tabindex: "-1" }, S.submittedAt ? "Sent. Thank you!" : "All done. Ready to send?"));
    main.append(el("p", { class: "lede" }, `You answered ${answered} of ${items.length} questions` + (pns ? ` (${pns} with “Prefer not to say”).` : ".")));
    if (S.submittedAt) { main.append(el("p", { class: "lede" }, "Your answers are saved. You can close this page.")); main.append(el("div", { class: "nav" }, el("span"), el("button", { class: "primary", type: "button", disabled: true }, "Sent"))); return; /* B5 */ }
    const btn = el("button", { class: "primary", type: "button", id: "send", onclick: () => submit(btn) }, "Send my answers");
    main.append(el("div", { class: "nav" }, el("button", { class: "ghost", type: "button", onclick: () => go(-1) }, "Back"), btn));
  }
  async function submit(btn) {
    btn.disabled = true; btn.textContent = "Sending…";
    const c = cur(); leave(c.id); shownAt = performance.now();
    const live = new Set(screens().map(x => x.id)); Object.keys(S.answers).forEach(k => { if (/^(PICK\d|RP:|RPA:)/.test(k) && !live.has(k)) delete S.answers[k]; }); // B3
    S.submittedAt = now();
    let ok = false;
    try { const back = await rpc("qa4_save", { p_slug: SLUG, p_run_id: S.runId, p_state: S, p_submit: true }); ok = !!(back && back.submitted_at); }
    catch (e) { ok = false; }
    if (!ok) { S.submittedAt = null; try { localStorage.setItem(lsKey(), JSON.stringify(S)); } catch (e) {} btn.disabled = false; btn.textContent = "Try sending again"; setStatus("Not sent. Please check your connection and try again. Your answers are still saved on this device."); return; }
    try { localStorage.setItem(lsKey(), JSON.stringify(S)); localStorage.setItem(SENT + ":" + SLUG, S.submittedAt); } catch (e) {}
    render();
  }
  // ----- start screens -----
  function intro(lines, buttons) {
    const main = $("#main"); main.replaceChildren(); $("#count").textContent = "";
    main.append(el("h1", { id: "q", tabindex: "-1" }, "Planning our family holiday"));
    lines.forEach(t => main.append(el("p", { class: "lede" }, t)));
    if (buttons) main.append(el("div", { class: "nav" }, buttons));
  }
  function startFresh(name) { S = newState(name); queueSave(); render(); }
  async function boot() {
    const m = /[?&]p=([a-z]+)/i.exec(location.search); SLUG = m ? m[1].toLowerCase() : null;
    if (!SLUG) { intro(["Please open this page from the personal link you were sent."]); return; }
    intro(["Loading\u2026"]);
    let name = null, remote = null, local = null;
    try { local = JSON.parse(localStorage.getItem(LS + ":" + SLUG) || "null"); } catch (e) {}
    try { name = await rpc("qa4_whoami", { p_slug: SLUG }); remote = await rpc("qa4_load", { p_slug: SLUG }); setStatus("Connected"); }
    catch (e) { setStatus("Offline: answers save on this device until the connection returns"); name = local && local.respondent; }
    if (!name) { intro(["This link doesn't look right. Please open the personal link you were sent."]); return; }
    let sentAt = null; try { sentAt = localStorage.getItem(SENT + ":" + SLUG); } catch (e) {}
    if (!sentAt && local && local.submittedAt) sentAt = local.submittedAt;
    if (!sentAt && remote && remote.submitted_at) sentAt = remote.submitted_at;
    if (sentAt) { intro(["Thank you, sent.", `Thank you, ${name}. Your answers were sent on ${new Date(sentAt).toLocaleString()}.`]); return; } // D42-1: never offer Continue / Start again after sending
    const cands = [local && local.respondent === name ? local : null, remote && !remote.submitted_at ? remote.state : null].filter(d => d && !d.submittedAt && d.v === Q.VERSION);
    cands.sort((a, b) => (b.updatedAt > a.updatedAt ? 1 : -1));
    const d = cands[0];
    if (!d) return startFresh(name);
    intro([`${name}, you have answers saved from ${new Date(d.updatedAt).toLocaleString()}.`], [
      el("button", { class: "ghost", type: "button", onclick: () => startFresh(name) }, "Start again"),
      el("button", { class: "primary", type: "button", onclick: () => { S = d; S._entered = -1; render(); } }, "Continue")]);
  }
  window.QA4APP = { get state() { return S; }, screens: () => screens(), go };
  boot();
})();
</script></body></html>
